<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="95%">
      <stop offset="0" stop-color="#3B2A6B"/>
      <stop offset=".55" stop-color="#22173F"/>
      <stop offset="1" stop-color="#140D28"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF8A5B" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FF8A5B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9B8F2"/>
      <stop offset="1" stop-color="#7E66C9"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3ECFF"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA97F"/>
      <stop offset=".6" stop-color="#FF7A4D"/>
      <stop offset="1" stop-color="#F0603A"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8F86A8"/>
      <stop offset=".45" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9C93B5"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB08A"/>
      <stop offset="1" stop-color="#FF6F45"/>
    </linearGradient>
    <linearGradient id="turq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DEBDD"/>
      <stop offset="1" stop-color="#16AFA1"/>
    </linearGradient>
    <radialGradient id="sun" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#FFF1A6"/>
      <stop offset=".6" stop-color="#FFD23F"/>
      <stop offset="1" stop-color="#F2B400"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#05020F" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="270" r="210" fill="url(#glow)"/>

  <!-- Le calendrier, en relief -->
  <g filter="url(#shadow)">
    <!-- épaisseur (les pages en dessous) -->
    <rect x="116" y="142" width="300" height="290" rx="52" fill="url(#side)"/>
    <rect x="108" y="130" width="300" height="290" rx="52" fill="#E9E0FF"/>
    <!-- page avant -->
    <rect x="96" y="118" width="300" height="290" rx="52" fill="url(#page)"/>
    <!-- bandeau corail -->
    <path d="M96 170a52 52 0 0 1 52-52h196a52 52 0 0 1 52 52v26H96z" fill="url(#head)"/>
    <path d="M118 136c20-12 60-14 120-14" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- anneaux -->
    <rect x="160" y="88" width="26" height="70" rx="13" fill="url(#ring)"/>
    <rect x="306" y="88" width="26" height="70" rx="13" fill="url(#ring)"/>
    <!-- points des jours -->
    <g fill="#D9CCF5">
      <circle cx="146" cy="240" r="11"/><circle cx="196" cy="240" r="11"/><circle cx="246" cy="240" r="11"/><circle cx="296" cy="240" r="11"/><circle cx="346" cy="240" r="11"/>
      <circle cx="146" cy="288" r="11"/><circle cx="346" cy="288" r="11"/>
      <circle cx="146" cy="336" r="11"/><circle cx="346" cy="336" r="11"/>
    </g>
    <!-- les deux : deux cœurs qui se chevauchent -->
    <path d="M206 372c-38-26-62-48-62-76a32 32 0 0 1 62-12 32 32 0 0 1 62 12c0 28-24 50-62 76z" fill="url(#coral)"/>
    <path d="M286 380c-38-26-62-48-62-76a32 32 0 0 1 62-12 32 32 0 0 1 62 12c0 28-24 50-62 76z" fill="url(#turq)" fill-opacity=".92"/>
    <path d="M168 288a18 18 0 0 1 24-14" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>

  <!-- soleil -->
  <circle cx="404" cy="112" r="50" fill="url(#sun)"/>
  <circle cx="390" cy="98" r="14" fill="#FFFFFF" fill-opacity=".55"/>
</svg>
